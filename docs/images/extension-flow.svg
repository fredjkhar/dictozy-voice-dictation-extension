<svg role="img" aria-labelledby="diagram-title diagram-desc" width="506pt" height="716pt" viewBox="0 0 505.88 715.88" xmlns="http://www.w3.org/2000/svg"><title id="diagram-title">Dictozy request architecture</title><desc id="diagram-desc">Chrome extension content script records user-initiated audio, service worker sends it to FastAPI, then xAI. Local preferences stay in Chrome, the API key stays on the server, and transcript text returns for safe insertion.</desc>
