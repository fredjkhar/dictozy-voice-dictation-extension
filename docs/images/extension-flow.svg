<polygon points="-19.44 19.44 -19.44 -696.44 486.44 -696.44 486.44 19.44" fill="#f8fafc" stroke="transparent"/>
<text x="233.5" y="-19.2" fill="#475569" font-family="DejaVu Sans" font-size="11" text-anchor="middle">Transcript returns through the backend and service worker.</text>
<text x="233.5" y="-7.2" fill="#475569" font-family="DejaVu Sans" font-size="11" text-anchor="middle">Text is inserted only if the original target remains safe.</text>
