<svg role="img" aria-labelledby="diagram-title diagram-desc" width="645pt" height="617pt" viewBox="0 0 644.7 617.5" xmlns="http://www.w3.org/2000/svg"><title id="diagram-title">Dictozy dictation lifecycle</title><desc id="diagram-desc">User starts recording, stops or discards it, transcription returns and the original field is checked for safe insertion. Unsafe completed results offer temporary Copy or Discard recovery; cancellations insert nothing.</desc>
