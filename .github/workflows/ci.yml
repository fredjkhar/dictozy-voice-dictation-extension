name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify backend dependency graph
        run: python -m pip check

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  extension:
    name: Extension Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifest JSON
        run: python3 -m json.tool extension/manifest.json >/dev/null

      - name: Check extension JavaScript syntax
        run: |
          node --check extension/dom-utils.js
          node --check extension/dictation-lifecycle.js
          node --check extension/site-preferences.js
          node --check extension/background-utils.js
          node --check extension/content.js
          node --check extension/background.js
          node --check extension/popup.js
          node --check extension/practice.js
          node --check extension/config.js
          node --check playwright.config.js

      - name: Run extension tests
        run: node --test extension/tests/*.test.js

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium extension workflows
        run: npm run test:browser

      - name: Validate extension package inputs
        run: python3 scripts/package_extension.py --check-only

      - name: Validate store assets
        run: python3 scripts/validate_store_assets.py

  website:
    name: Website Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate public site
        run: python3 scripts/validate_site.py

      - name: Check site test syntax
        run: |
          node --check playwright.site.config.js
          node --check tests/site/site.spec.js

      - name: Run website browser tests
        run: npm run test:site

  release-candidate:
    name: Review-only Release Package
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-')
    needs: [backend, extension, website]
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact tested candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build and byte-verify review bundle
        run: python3 scripts/build_release_review.py
      - name: Upload review artifact without publishing
        uses: actions/upload-artifact@v4
        with:
          name: dictozy-review-${{ github.event.pull_request.head.sha }}
          path: dist/release-0.1.13/
          if-no-files-found: error
          retention-days: 30
