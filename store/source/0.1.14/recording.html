<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Practice notebook</title>
<style>
  * { box-sizing: border-box }
  html { color-scheme: light; font: 18px/1.45 system-ui,sans-serif; color:#0b1220; background:#eff4fe }
  body { margin:0; padding:54px 76px }
  header { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:720; letter-spacing:-.04em }
  header img { width:140px; height:34px } h1 { font-size:56px; letter-spacing:-.055em; line-height:1.06; margin:40px 0 12px }
  p { margin:0; color:#475569; font-size:21px }
  article { margin-top:38px; height:352px; padding:34px 38px; background:white; border:1px solid #c7d4e9; border-radius:24px; box-shadow:0 16px 40px #102a5410 }
  label { display:block; margin:0 0 12px; font-size:18px; font-weight:680 }
  textarea { display:block; width:73%; height:136px; padding:18px; border-radius:10px; border:1px solid #718199; resize:none; background:white; color:#0f172a; font:22px/1.5 Georgia,serif }
  textarea:focus { outline:2px solid #2563eb; outline-offset:2px }
  footer { margin-top:24px; font-size:15px; color:#475569 }
</style></head><body>
<header><img src="/lockup.svg" alt="Dictozy"></header>
<h1>Dictate right where you write.</h1>
<p>Start in a supported field. Stop to transcribe, or discard to keep your draft as it is.</p>
<article><label for="note">Notebook draft</label><textarea id="note">Things to bring tomorrow: the blue notebook and a pencil.</textarea></article>
<footer>Recording controls from the extension · Example writing field</footer>
</body></html>
