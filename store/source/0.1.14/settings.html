<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dictozy settings</title>
<style>
  * { box-sizing:border-box }
  body { margin:0; background:#eff4fe; color:#0b1220; font-family:system-ui,sans-serif; }
  header { position:absolute; top:58px; left:60px; display:flex; align-items:center; gap:10px; font-size:22px; font-weight:720; letter-spacing:-.04em }
  header img { width:140px; height:34px }
  main { width:330px; margin:245px 0 0 60px }
  h1 { font-size:58px; line-height:1.05; letter-spacing:-.055em; margin:0 0 22px }
  p { font-size:20px; line-height:1.48; color:#475569; margin:0; }
  .views { position:absolute; top:95px; left:417px; right:43px; display:flex; align-items:start; justify-content:space-evenly; gap:24px }
  figure { margin:0; min-width:0; } figcaption { font-size:17px; font-weight:650; margin-bottom:12px }
  figure img { display:block; max-width:100%; height:auto; border:1px solid #c3cfe0; border-radius:8px; box-shadow:0 12px 26px #0b254113 }
</style></head><body>
<header><img src="/lockup.svg" alt="Dictozy"></header>
<main><h1>Make it<br>your own.</h1><p>Set a recording limit, choose a language, or save personal vocabulary. Sharing saved terms is a separate choice.</p></main>
<div class="views"><figure><figcaption>Dictation settings</figcaption><img src="/popup.png" alt="Toolbar popup"></figure><figure><figcaption>Personal vocabulary</figcaption><img src="/vocabulary.png" alt="Expanded vocabulary controls"></figure></div>
</body></html>
